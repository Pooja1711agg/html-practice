<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f7f8fa">
<title>Single Ride Ticket — Demo</title>
<style>
:root{--blue:#0878d6;--ink:#202936}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;min-height:100%;background:#eef0f3;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{height:100vh;height:100dvh;min-height:100vh;min-height:100dvh;display:flex;justify-content:center;overflow:hidden}
.phone{position:relative;width:min(100%,430px);height:100vh;height:100dvh;min-height:100vh;min-height:100dvh;background:#fbfbfc;display:flex;flex-direction:column;padding: max(10px,env(safe-area-inset-top)) 18px max(15px,env(safe-area-inset-bottom));box-shadow:0 0 28px #0000000b;overflow:auto}
.top{height:45px;display:flex;align-items:center;justify-content:flex-end;margin-top:20px;}
.close{border:0;background:none;color:#65717d;font:16px inherit;padding:9px 1px}
.heading{height:43px;border-radius:7px 7px 0 0;background:linear-gradient(#1484e5,#0668c5);color:white;display:grid;place-items:center;font-size:18px;font-weight:650;letter-spacing:.25px;box-shadow:0 2px 4px #0002}
.qr-zone{height:260px;display:grid;place-items:center;padding:8px 0 22px}
#qr{width:min(82vw,270px);height:min(82vw,270px);background:#fff;display:grid;place-items:center;position:relative;padding:3px}
#qr canvas{display:block;width:90%;height:90%;image-rendering:pixelated;image-rendering:crisp-edges}
.ticket{height:250px;position:relative;margin:0 0px;border-radius:10px;overflow:hidden;background:#0097e0;isolation:isolate;box-shadow:0 2px 5px #0002;margin-top:20px;}
.ticket-art{position:absolute; top:25px;width:100%;height:100%;z-index:-1}
.time-window{position:absolute;left:0;right:0;top:0;height:51px;overflow:hidden;display:flex;align-items:stretch;z-index:4;box-shadow:0 2px 4px #003b7333}
.time-segment{height:100%;flex:1}
.time-segment.teal{background:#817967} 
.time-segment.red{background:#433677}
.time-segment.magenta{background:#5E6AA0}
#time{position:absolute;left:0;top:0;width:max-content;height:100%;display:flex;align-items:center;white-space:nowrap;padding:0 10px;color:#fff;font-size:27px;font-weight:700;letter-spacing:-.35px;text-shadow:0 4px 4px rgba(0, 0, 0, 0.8), 0 4px 4px rgba(0, 0, 0, 0.35);z-index:2;will-change:transform}
.label-panel{position:absolute;z-index:3;left:34%;right:4%;top:78px;min-height:75px;background:linear-gradient(110deg,#3bcf28,#20bf26);border-radius:9px;display:flex;align-items:center;justify-content:center;padding:8px 7px;box-shadow:0 2px 5px #005e3850}
.label-panel span{font-size:clamp(20px,6vw,26px);line-height:1.02;color:white;font-style:italic;font-weight:800;text-align:center;text-shadow:0 1px 2px #1b762b55}
.ticket-symbol{position:absolute;left:18%;top:100px;z-index:3;color:white;font-size:29px;transform:rotate(-18deg);text-shadow:0 1px 2px #1457a766}
.sample{position:absolute;z-index:5;right:8px;bottom:7px;color:#fff;font-size:9px;font-weight:800;letter-spacing:1.4px;background:#064f9b66;padding:4px 6px;border-radius:4px}
.notice{text-align:center;margin:8px 0 0;color:#a43b55;font-size:10px;letter-spacing:1.15px;font-weight:750}
.bottom{margin-top:auto;padding:22px 2px 0;display:flex;justify-content:flex-end;color:#087fa8;font-size:17px;font-weight:600}.bottom button{border:0;background:none;color:inherit;font:inherit;padding:8px 2px;cursor:pointer}
.bottom span{display:flex;gap:7px;align-items:center}
.home{width:135px;height:5px;border-radius:99px;background:#171717;margin:20px auto 0}
@media(max-height:740px){.qr-zone{height:225px}#qr{width:min(70vw,220px);height:min(70vw,220px)}.ticket{height:180px}.label-panel{top:70px;min-height:68px}}
 
.details-page{display:none;position:absolute;inset:0;z-index:20;background:#07172d;padding:6px 2px 0;overflow:auto;color:#080808}
.details-page.open{display:block}
.details-close{position:sticky;top:0;float:right;z-index:2;margin:0 14px -4px 0;border:0;border-radius:40px;background:#aeb3b9d9;color:#fff;font-size:18px;padding:8px 16px}
.details-card{clear:both;position:relative;min-height:calc(100% - 12px);margin:0 auto;background:#fff;border-radius:21px 21px 9px 9px;padding:56px 16px 12px;box-shadow:0 0 6px #0003;display:flex;flex-direction:column}
.detail-section{padding:0 0 13px;margin:0 0 16px;border-bottom:1px solid #e3e3e3}
.detail-label{font-size:15px;font-weight:800;letter-spacing:1.1px;color:#707070;margin-bottom:7px}
.detail-value{font-size:17px;font-weight:400;line-height:1.25}
.time-left{display:inline-block;margin-top:7px;background:#0876b9;color:white;border-radius:3px;padding:3px 5px;font-size:13px;font-weight:800}
.trip-row{display:flex;justify-content:space-between;align-items:flex-end}
.trip-row .detail-value{white-space:nowrap}
.purchase-section .detail-value{margin-bottom:16px}
.payment-row{display:flex;align-items:center;justify-content:space-between;font-size:16px}
.mastercard{width:38px;height:21px;position:relative;display:inline-block;flex:none}
.mastercard i,.mastercard b{position:absolute;top:1px;width:20px;height:20px;border-radius:50%;background:#eb001b}
.mastercard i{left:0}.mastercard b{left:12px;background:#f79e1b;mix-blend-mode:multiply}
.ticket-id-section{border-bottom:0;margin-bottom:0}
.details-footer{margin-top:auto;padding-top:14px;border-top:1px dotted #333;display:flex;justify-content:space-between;color:#0784aa;font-size:16px}
.demo-disclaimer{text-align:center;color:#a43b55;font-size:8px;font-weight:800;letter-spacing:.5px;padding-top:9px}
</style>
</head>

<script>
(() => {
 const time=document.getElementById('time'), strip=document.querySelector('.time-window');
 let offset=0,dir=1,lastFrame=0;
 function clock(){
   const d=new Date();
   const t=d.toLocaleTimeString([], {hour12:true});
   const day=String(d.getDate()).padStart(2,'0'),month=String(d.getMonth()+1).padStart(2,'0'),year=String(d.getFullYear()).slice(-2);
   time.textContent=`${t} ${day}/${month}/${year}`;
 }
 function frame(now){
   if(now-lastFrame>500){clock();lastFrame=now;}
   const textWidth=time.getBoundingClientRect().width;
   const travel=Math.max(0,strip.clientWidth-textWidth-16);
   offset+=dir*1.15;
   if(offset>=travel){offset=travel;dir=-1;}
   if(offset<=0){offset=0;dir=1;}
   time.style.transform=`translateX(${8+offset}px)`;
   requestAnimationFrame(frame);
 }

 // This is a changing decorative pattern only; it is not a standards-compliant or scannable ticket QR.
 const canvas=document.getElementById('qrCanvas'),ctx=canvas.getContext('2d'),N=46;
 function drawFinder(x,y){
   // Three prominent nested-square corner markers.
   ctx.fillStyle='#080b10';ctx.fillRect(x,y,9,9);
   ctx.fillStyle='#fff';ctx.fillRect(x+1,y+1,7,7);
   ctx.fillStyle='#080b10';ctx.fillRect(x+2,y+2,5,5);
 }
 function drawQr(){
   ctx.fillStyle='#fff';ctx.fillRect(0,0,N,N);
   // Seed is tied to a two-second time slot, so the pattern visibly changes every 2 seconds.
   let seed=Math.floor(Date.now()/2000)+7319;
   const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};
   ctx.fillStyle='#080b10';
   // Keep the surrounding pattern tight against the centre marker.
   for(let y=1;y<N-1;y++)for(let x=1;x<N-1;x++){
     const inCenter=x>=16&&x<=29&&y>=16&&y<=29;
     if(!inCenter&&rand()>.52)ctx.fillRect(x,y,1,1);
   }
   // Three nested white squares, each separated by a black border,
   // with a small black square at the exact centre.
   ctx.fillStyle='#080b10';ctx.fillRect(16,16,14,14);
   ctx.fillStyle='#fff';ctx.fillRect(17,17,12,12);
   ctx.fillStyle='#080b10';ctx.fillRect(18,18,10,10);
   ctx.fillStyle='#fff';ctx.fillRect(19,19,8,8);
   ctx.fillStyle='#080b10';ctx.fillRect(20,20,6,6);
   ctx.fillStyle='#fff';ctx.fillRect(21,21,4,4);
   ctx.fillStyle='#080b10';ctx.fillRect(22,22,2,2);
 }
 const details=document.getElementById('detailsPage');
 const format=d=>d.toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'});
 const activation=new Date(Date.now()-30*60*1000);
 const validUntil=new Date(activation.getTime()+2*60*60*1000);
 const activationEnds=new Date(activation.getTime()+5*60*1000);
 const purchase=new Date(activation.getTime()-3*60*1000);
 document.getElementById('activatedAt').textContent=format(activation);
 document.getElementById('validUntil').textContent=format(validUntil);
 document.getElementById('activationEnds').textContent=format(activationEnds);
 document.getElementById('purchasedAt').textContent=format(purchase);
 function updateCountdown(){
   const ms=Math.max(0,validUntil-Date.now()),mins=Math.ceil(ms/60000);
   const h=Math.floor(mins/60),m=mins%60;
   document.getElementById('timeLeft').textContent=`${h} HOUR${h===1?'':'S'} ${m} MINUTE${m===1?'':'S'} LEFT`;
 }
 updateCountdown();setInterval(updateCountdown,1000);
 document.getElementById('detailsButton').addEventListener('click',()=>{details.classList.add('open');details.setAttribute('aria-hidden','false');});
 document.getElementById('detailsClose').addEventListener('click',()=>{details.classList.remove('open');details.setAttribute('aria-hidden','true');});
 drawQr();drawQr();setInterval(drawQr,2000);
 clock();requestAnimationFrame(frame);
})();
</script>
